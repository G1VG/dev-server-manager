# Nginx Load Balancer Configuration for Docker & Host Clusters
upstream devserver_cluster {
    least_conn;  # Routes traffic dynamically to the worker with the fewest active requests
    server webapp-1:5001 max_fails=2 fail_timeout=10s;
    server webapp-2:5002 max_fails=2 fail_timeout=10s;
    server webapp-3:5003 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost devserver.local;

    # Performance & Timeouts
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    location / {
        proxy_pass http://devserver_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Adds header revealing which backend worker served the request
        add_header X-Upstream-Node $upstream_addr always;
    }
}

